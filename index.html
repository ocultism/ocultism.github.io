<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cultist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--mute:rgba(255,255,255,.55);color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#000;color:var(--ink);overflow:hidden;
  font-family:'Onest','Helvetica Neue',Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}

/* вход */
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#000;border:0;color:var(--ink);
  font:300 15px 'Onest',sans-serif;letter-spacing:.12em;cursor:pointer;transition:opacity .9s ease .5s}
#gate span{display:flex;flex-direction:column;align-items:center;gap:30px}
#gate i{width:10px;height:10px;border-radius:50%;background:#fff;position:relative}
#gate i::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid #fff;animation:ping 2.2s ease-out infinite}
#gate:focus-visible{outline:1px solid #fff;outline-offset:-24px}
body.in #gate{opacity:0;pointer-events:none}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(3.2);opacity:0}}

/* сцена */
#stage{position:fixed;inset:0;z-index:1;clip-path:circle(0 at var(--cx,50%) var(--cy,50%));
  transition:clip-path 1.8s cubic-bezier(.7,0,.2,1)}
body.in #stage{clip-path:circle(150vmax at var(--cx,50%) var(--cy,50%))}
#bg,.fb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb{background:#000;overflow:hidden}
.fb::before,.fb::after{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.14),transparent 62%);animation:drift 22s ease-in-out infinite alternate}
.fb::before{left:-20vmax;top:-20vmax}
.fb::after{right:-25vmax;bottom:-25vmax;animation-duration:30s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(35vmax,22vmax) scale(1.25)}}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.25),rgba(0,0,0,.75) 85%)}

main{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(22px,4vw,56px);padding:24px;text-align:center}
h1{margin:0;font:700 clamp(84px,24vw,360px)/.85 'UnifrakturCook','UnifrakturMaguntia',serif;letter-spacing:-.01em;
  text-shadow:0 0 .35em rgba(255,255,255,.35),0 0 1.2em rgba(255,255,255,.12)}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px clamp(26px,5vw,64px)}
nav a,nav button{all:unset;box-sizing:border-box;color:var(--mute);cursor:pointer;
  font:300 clamp(20px,2.4vw,30px)/1.2 'Onest',sans-serif;letter-spacing:-.01em;
  padding:6px 2px;background:linear-gradient(#fff,#fff) 0 100%/0 1px no-repeat;
  transition:color .35s ease,background-size .5s cubic-bezier(.16,1,.3,1)}
nav a:hover,nav a:focus-visible,nav button:hover,nav button:focus-visible{color:#fff;background-size:100% 1px}
nav a:focus-visible,nav button:focus-visible{outline:1px solid #fff;outline-offset:6px}
#snd{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:none;border:0;color:var(--mute);font:300 13px 'Onest',sans-serif;cursor:pointer;padding:6px}
#snd:hover,#snd:focus-visible{color:#fff;outline:none}

/* курсор */
#cur{position:fixed;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;
  mix-blend-mode:difference;pointer-events:none;z-index:50;opacity:0;transition:width .4s,height .4s,margin .4s,opacity .4s}
#cur.big{width:64px;height:64px;margin:-32px 0 0 -32px}
@media (hover:hover) and (pointer:fine){body.in,body.in a,body.in button{cursor:none}#cur.on{opacity:1}}
@media (prefers-reduced-motion:reduce){#stage,#gate{transition:none}.fb::before,.fb::after,#gate i::after{animation:none}}
</style>
</head>
<body>

<button id="gate" aria-label="Войти"><span><i></i>кликни</span></button>

<div id="stage">
  <div class="fb"></div>
  <video id="bg" src="bg.mp4" loop playsinline preload="auto"></video>
  <div class="shade"></div>
  <main>
    <h1 id="name" data-text="cultist">cultist</h1>
    <nav>
      <a href="https://t.me/svprotn" target="_blank" rel="noopener">telegram</a>
      <button id="ds" type="button" data-copy="espilx">discord</button>
      <a href="https://steamcommunity.com/id/cultistka/" target="_blank" rel="noopener">steam</a>
    </nav>
  </main>
  <button id="snd" aria-pressed="false">звук выкл</button>
</div>

<div id="cur"></div>

<script>
(function(){
  var body=document.body, gate=document.getElementById('gate'), bg=document.getElementById('bg'),
      fb=document.querySelector('.fb'), snd=document.getElementById('snd'), name=document.getElementById('name'),
      ds=document.getElementById('ds'), cur=document.getElementById('cur'),
      reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* видео: если bg.mp4 не нашёлся, остаётся тёмный фон */
  bg.style.opacity=0;
  bg.addEventListener('playing',function(){bg.style.opacity=1;fb.style.display='none'});
  bg.addEventListener('error',function(){bg.style.display='none'});

  function setSnd(on){bg.muted=!on;snd.textContent=on?'звук вкл':'звук выкл';snd.setAttribute('aria-pressed',on)}
  snd.addEventListener('click',function(){setSnd(bg.muted)});

  /* discord: копирует ник */
  ds.addEventListener('click',function(){
    var t=ds.dataset.copy;
    function done(){ds.textContent='espilx скопирован';setTimeout(function(){ds.textContent='discord'},1800)}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){ds.textContent=t;setTimeout(function(){ds.textContent='discord'},2500)})}
    else{ds.textContent=t;setTimeout(function(){ds.textContent='discord'},2500)}
  });

  /* ник собирается из шума */
  function scramble(el){
    var txt=el.dataset.text, chars='▒░#*+/\\<>01', t0=performance.now(), dur=1400;
    (function tick(now){
      var p=Math.min(1,(now-t0)/dur), out='';
      for(var i=0;i<txt.length;i++){out+=(p*txt.length*1.5>i)?txt[i]:chars[Math.random()*chars.length|0]}
      el.textContent=out;
      if(p<1)requestAnimationFrame(tick);else el.textContent=txt;
    })(t0);
  }

  function enter(e){
    var st=document.getElementById('stage');
    st.style.setProperty('--cx',(e.clientX||innerWidth/2)+'px');
    st.style.setProperty('--cy',(e.clientY||innerHeight/2)+'px');
    body.classList.add('in');
    bg.muted=false;
    var p=bg.play();
    if(p&&p.then){p.then(function(){setSnd(true)}).catch(function(){bg.muted=true;bg.play().catch(function(){});setSnd(false)})}
    if(!reduce){name.textContent='';setTimeout(function(){scramble(name)},700)}
  }
  gate.addEventListener('click',enter,{once:true});

  /* курсор */
  if(matchMedia('(hover:hover) and (pointer:fine)').matches){
    var tx=0,ty=0,x=0,y=0;
    addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY;cur.classList.add('on')},{passive:true});
    (function loop(){x+=(tx-x)*.2;y+=(ty-y)*.2;cur.style.transform='translate('+x+'px,'+y+'px)';requestAnimationFrame(loop)})();
    document.querySelectorAll('a,button').forEach(function(el){
      el.addEventListener('pointerenter',function(){cur.classList.add('big')});
      el.addEventListener('pointerleave',function(){cur.classList.remove('big')});
    });
  }
})();
</script>
</body>
</html>
